<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabelas</title>

    <!-- linkando css -->
     <link rel="stylesheet" href="./css/global.css">

</head>
<body>
    <header class="header-title">
        <h1>Exemplos de tabelas</h1>
        <!-- título para a tabela -->
         <h2>Notas 1DS - SESI</h2>
    </header>
    <main class="main-content">
        <!-- container para a tabela -->
         <table>
            <!-- criar uma linha na tabela -->
             <tr>
                <!-- criar os cabeçalhos das linhas da tabela -->
                <th>Aluno</th>
                <th>Professor</th>
                <th>Disciplina</th>
                <th>Nota</th>
             </tr>

         </table>
    </main>
</body>
</html>
