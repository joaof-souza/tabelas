<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabelas</title>

    <!-- linkando css -->
     <link rel="stylesheet" href="./css/global.css">

</head>
<body>
    <main class="main-content">
        <header class="header-title">
            <h1>Exemplos de tabelas</h1>
            <!-- título para a tabela -->
             <h2>Notas 1DS - SESI</h2>
        </header>

        <!-- container para a tabela -->
         <table class="table-main">
            <!-- criar uma linha na tabela -->
             <tr>
                <!-- criar os cabeçalhos das linhas da tabela -->
                <th>Aluno</th>
                <th>Professor</th>
                <th>Disciplina</th>
                <th>Nota</th>
             </tr>
             <tr>
                <td>Júlia</td>
                <td>Celso</td>
                <td>Física</td>
                <td>10</td>
             </tr>
             <tr>
                <td>Barbara</td>
                <td>Liliane</td>
                <td>Química</td>
                <td>9,8</td>
             </tr>

         </table>
    </main>
</body>
</html>
