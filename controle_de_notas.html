<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabelas</title>

    <!-- linkando css -->
     <link rel="stylesheet" href="./css/global.css">

</head>
<body>
    <main class="main-content">
        <table class="table-main">
            <thead class="table-main__header">
                <tr>
                    <th colspan="6">Controle de Notas</th>
                </tr>

                <tr>
                    <th rowspan="2">Aluno</th>
                    <th rowspan="2">Professor</th>
                    <th rowspan="2">Disciplina</th>
                    <th colspan="3">Notas</th>
                </tr>

                <tr>
                    <th>Prova</th>
                    <th>Projeto</th>
                    <th>Seminário</th>
                </tr>
            </thead>


            <tbody class="table-main__body">
                <tr>
                    <td>Felix</td>
                    <td>Juliano</td>
                    <td>Filosofia</td>
                    <td>7</td>
                    <td>6,5</td>
                    <td>10</td>
                </tr>
                
                <tr>
                    <td>Felix</td>
                    <td>Alison</td>
                    <td>Ed. Física</td>
                    <td>10</td>
                    <td>6,5</td>
                    <td>8,2</td>
                </tr>
                
                <tr>
                    <td>Felix</td>
                    <td>Laura</td>
                    <td>Português</td>
                    <td>8</td>
                    <td>7,5</td>
                    <td>6,5</td>
                </tr>

            </tbody>


            <tfoot class="table-main__foot">
                <tr>
                    <th colspan="3">Média</th>
                    <td>8,33</td>
                    <td>6,83</td>
                    <td>8,23</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>
</html>
